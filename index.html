/* هوية د. عيسى بن علي الحمد: كحلي #2F4053 · ذهبي #7B6F5A/#A6947A · رملي #F4F1EC · Tajawal
   التصميم: صفحة واحدة لكل نشاط، بطاقة مطالبة في الأعلى ثم حقول الكتابة */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --sand:#F4F1EC; --ink:#27313D; --ink2:#6B7280; --line:#E5E7EB;
  --navy:#2F4053; --navy-d:#233140; --gold:#7B6F5A; --gold-l:#A6947A;
  --accent:#2F4053; --accent-ink:#FFFFFF; --gold-text:#7B6F5A; --chip:#F4F1EC; --chip-line:#CDBFA6; --ok:#2F7D5B;
  --shadow:0 1px 2px rgba(35,49,64,.06),0 6px 20px rgba(35,49,64,.06);
  --font:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A2430; --surface:#233140; --sand:#2B3A4A; --ink:#E9EDF1; --ink2:#A9B4C0; --line:#3A4B5D;
  --accent:#A6947A; --accent-ink:#1A2430; --gold-text:#C9B89C; --chip:#2B3A4A; --chip-line:#6B6252; --ok:#6CC9A0;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A2430; --surface:#233140; --sand:#2B3A4A; --ink:#E9EDF1; --ink2:#A9B4C0; --line:#3A4B5D;
  --accent:#A6947A; --accent-ink:#1A2430; --gold-text:#C9B89C; --chip:#2B3A4A; --chip-line:#6B6252; --ok:#6CC9A0;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.75;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px;border-radius:6px}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{height:46px;width:auto;display:block}
.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;line-height:1.3;color:var(--ink)}
.brand span{font-size:13px;color:var(--ink2)}
.saved{font-size:13px;color:var(--ok);opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.on{opacity:1}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--gold-text);border-color:var(--chip-line)}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 13px;font-size:14px}

.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.steps button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 12px;cursor:pointer;font-size:14px;line-height:1.5;color:var(--ink2);position:relative}
.steps button b{color:var(--ink);margin-inline-end:4px}
.steps button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button.on b{color:var(--accent-ink)}
.steps button.ext{border-style:dashed}
.steps button.done::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* الصفحة */
.page{display:none;padding:26px 0 90px}
.page.on{display:block}
.kicker{font-size:14px;color:var(--gold-text);font-weight:700;letter-spacing:.02em}
h1{font-size:clamp(26px,5.2vw,36px);line-height:1.35;margin:4px 0 6px;color:var(--ink);text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.pill{background:var(--sand);color:var(--gold-text);border-radius:999px;padding:2px 14px;font-size:14px;font-weight:500}
.intro{background:var(--sand);border-inline-start:4px solid var(--gold-l);padding:12px 16px;border-radius:10px;margin:0 0 22px;color:var(--ink)}
h2{font-size:19px;margin:30px 0 10px;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.ptag{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ptag span{font-weight:700;color:var(--gold-text);font-size:15px}
.ptext{white-space:pre-wrap;margin:0;font-size:17px;line-height:2}
.chip{display:inline-block;min-width:3.2em;padding:0 8px;margin:0 2px;background:var(--chip);border:1.5px dashed var(--chip-line);border-radius:8px;color:var(--ink);outline:none;white-space:pre-wrap;max-width:100%;vertical-align:baseline;cursor:text}
.chip:empty::before{content:attr(data-ph);color:var(--ink2)}
.chip:focus{border-style:solid;border-color:var(--gold-l)}
.chip.filled{border-style:solid;background:transparent;border-color:var(--gold-l)}
.hint{font-size:14px;color:var(--ink2);margin:6px 0 0}
details{margin-top:12px}
summary{cursor:pointer;color:var(--gold-text);font-weight:700;padding:6px 0}
details .card{margin-top:8px}
.gnum{color:var(--gold-text);font-weight:700;margin-inline-end:6px}

label.fl{display:block;font-weight:700;margin:20px 0 6px;color:var(--ink)}
.sub{font-weight:400;color:var(--ink2);font-size:14px;margin-inline-start:6px}
textarea,.cell{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.8;resize:vertical;min-height:3.2em}
textarea:focus,.cell:focus{border-color:var(--gold-l);outline:none}
.pv{display:none}

.rview{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;margin-top:8px}
.rview p{margin:.3em 0}.rview ul,.rview ol{margin:.3em 0;padding-inline-start:1.4em}
.rview h4{margin:.8em 0 .2em;color:var(--gold-text);font-size:17px}
.tw{overflow-x:auto;margin:8px 0;border-radius:10px;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;min-width:480px;font-size:16px;line-height:1.6}
table.t th{background:var(--navy);color:#fff;font-weight:700;text-align:start;padding:9px 12px;border-inline-end:1px solid rgba(255,255,255,.18)}
:root[data-theme="dark"] table.t th{background:#3B4F65}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) table.t th{background:#3B4F65}}
table.t td{padding:9px 12px;border-top:1px solid var(--line);border-inline-end:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:var(--sand)}
table.t td.fx{font-weight:700;color:var(--gold-text);white-space:nowrap;background:var(--sand)}
table.t td[contenteditable]{min-width:7em;outline:none}
table.t td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--gold-l)}
.rtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}

.checks{display:grid;gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:5px;accent-color:var(--navy);flex:0 0 auto}
.chk:has(input:checked){border-color:var(--gold-l);background:var(--sand)}
.mx{width:100%;border-collapse:collapse}
.mx td,.mx th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
.mx th{color:var(--gold-text);font-size:15px}
.mx input{width:22px;height:22px;accent-color:var(--navy)}
.quote{margin:30px 0 0;padding:16px 18px;border-radius:12px;background:var(--navy);color:#fff;font-weight:500}
:root[data-theme="dark"] .quote{background:#2B3A4A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .quote{background:#2B3A4A}}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:34px}
.home-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.home-grid{grid-template-columns:1fr}.logo{height:40px}.brand span{display:none}}
.how{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.how li{counter-increment:s;display:flex;gap:12px;align-items:baseline}
.how li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1}
.scale{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.note{font-size:14px;color:var(--ink2);margin-top:20px}
.print-logo{display:none}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy-d);color:#fff;padding:8px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.toast.on{opacity:1}

@page{size:A4;margin:14mm 14mm 14mm}
@media print{
  body{background:#fff;color:#000;font-size:12.5pt;padding:0}
  :root{--bg:#fff;--surface:#fff;--sand:#F4F1EC;--ink:#111;--ink2:#444;--line:#cfcfcf;--gold-text:#7B6F5A;--chip:#fff;--chip-line:#A6947A;--accent:#2F4053;color-scheme:light}
  .top,.nav,.btn,.rtools,details,.steps,.toast,.noprint,summary{display:none!important}
  .page{display:block!important;padding:0;break-before:page}
  .page:first-of-type{break-before:auto}
  .print-logo{display:block;height:15mm;width:auto;margin:0 0 4mm auto}
  .card,.intro,.rview,.chk,.quote{box-shadow:none;break-inside:avoid}
  textarea{display:none!important}
  .pv{display:block;white-space:pre-wrap;border:1.2px solid var(--line);border-radius:8px;padding:8px 10px;min-height:3.4em;background:repeating-linear-gradient(transparent 0,transparent 7mm,#e6e2da 7mm,#e6e2da 7.2mm)}
  .pv:empty::before{content:"\00a0"}
  .rview.hasres{border-style:solid}
  .tw{overflow:visible;border-color:#bbb}
  table.t{min-width:0}
  table.t th{background:#2F4053!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.t tr:nth-child(even) td,table.t td.fx,.pill,.intro,.quote,.chk:has(input:checked){-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .quote{background:#2F4053!important;color:#fff!important}
  .chip{border-style:solid;padding:0 6px}
  .chip:empty::before{color:#999}
  h1{font-size:22pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 main:"لدي قائمة المهام التالية: [الصق المهام]. صنّفها إلى: مهم وعاجل، مهم وغير عاجل، يمكن تفويضه، يمكن تأجيله أو حذفه. ثم اقترح لي أول ثلاث خطوات عملية لليوم، مع تفسير مختصر للترتيب.",
 guide:["رتّب المهام التالية بحسب الأولوية، وبيّن لي لماذا وضعت كل مهمة في موقعها: [اكتب مهامك].","قبل أن ترتب المهام، اسألني عن أي موعد نهائي أو التزام قد يغيّر الأولويات.","اختصر الخطة إلى أهم 3 خطوات فقط أستطيع البدء بها اليوم.","راجع ترتيبك مرة أخرى وحدد مهمة واحدة يمكنني تأجيلها أو حذفها دون أثر كبير."],
 blocks:[{t:"field",pre:1,id:"tasks",map:["الصق المهام","اكتب مهامك"],label:"قائمة المهام الحالية",rows:5,sub:"اكتبها هنا وتنتقل تلقائيًا إلى المطالبة"},

{id:"a2",short:"خطتي",tag:"النشاط 2",title:"حوّل التراكم إلى خطة تنفيذ",axis:"المحور الثاني · إدارة الوقت والمهام",min:"15 دقيقة",p:"P02",
 intro:"اختر مهمة كبيرة أو مشروعًا مؤجلًا لديك، وفكّكه إلى خطوات صغيرة قابلة للإنجاز.",
 main:"لدي هذه المهمة: [اكتب المهمة]. الموعد النهائي: [التاريخ]. الوقت المتاح لي أسبوعيًا: [عدد الساعات]. قسّم المهمة إلى خطوات صغيرة مرتبة، وحدد لكل خطوة مدة تقديرية، وابدأ بأصغر خطوة يمكن تنفيذها خلال 15 دقيقة.",
 guide:["قسّم هذه المهمة الكبيرة إلى خطوات صغيرة قابلة للتنفيذ: [اكتب المهمة].","ابدأ بأصغر خطوة يمكن تنفيذها خلال 15 دقيقة، ثم رتّب بقية الخطوات بعدها.","قدّر الوقت المتوقع لكل خطوة مع إضافة هامش واقعي للطوارئ.","راجع الخطة وحدد أي خطوة ما زالت كبيرة أو غامضة، ثم فككها أكثر."],
 blocks:[{t:"field",pre:1,id:"task",map:["اكتب المهمة"],label:"المهمة / المشروع",rows:2,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"due",map:["التاريخ"],label:"الموعد النهائي",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"hrs",map:["عدد الساعات"],label:"الوقت المتاح لي أسبوعيًا (بالساعات)",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},

  {t:"checks",id:"test",label:"اختبار الواقعية",items:["هل الخطة تناسب وقتي فعلًا؟","هل فيها هامش للطوارئ؟","هل أول خطوة واضحة بما يكفي لأبدأ دون تردد؟"]}]},
{id:"a3",short:"أسبوعي",ext:true,tag:"النشاط 3",title:"صمّم أسبوعك بذكاء",axis:"امتداد · بعد الورشة",min:"اختياري",p:"P03",
 intro:"لا نبحث عن جدول مثالي، بل عن أسبوع واقعي يوازن بين الالتزامات والطاقة والأولويات.",
 main:"هذه التزاماتي الثابتة: [التزاماتي]. وهذه أولوياتي لهذا الأسبوع: [أولوياتي]. صمّم لي جدولًا أسبوعيًا واقعيًا، مع فترات تركيز، وفترات للمهام الخفيفة، وهامش للطوارئ. لا تملأ كل وقت الفراغ.",
 guide:["هذه التزاماتي الثابتة: [التزاماتي]. وأولوياتي لهذا الأسبوع: [أولوياتي]. صمّم لي أسبوعًا واقعيًا.","وزّع المهام بحسب مستوى التركيز: عميق، متوسط، خفيف.","اترك لي وقتًا للطوارئ والراحة، ولا تملأ جميع ساعات الأسبوع.","راجع الجدول وحدد أكثر يوم مزدحم، ثم أعد توزيعه بطريقة أكثر واقعية."],
 blocks:[{t:"field",pre:1,id:"fixed",map:["التزاماتي"],label:"التزاماتي الثابتة (دراسة، عمل، مواصلات…)",rows:3,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"prio",map:["أولوياتي"],label:"أولوياتي لهذا الأسبوع",rows:3,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"result",id:"res",label:"الجدول الناتج",sub:"الصقه هنا ليظهر منسقًا"},
  {t:"table",id:"week",label:"أسبوعي",cols:["اليوم","أهم مهمة","وقت التركيز","مهمة خفيفة / احتياط"],fixed:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"]}],
 closing:"قاعدة الورشة: لا تملأ كل دقيقة. الخطة الجيدة تترك مساحة للحياة الحقيقية."},
{id:"a4",short:"تحسين",tag:"النشاط 4",title:"من مدخلات مبعثرة إلى مخرج احترافي",axis:"المحور الثالث · رفع كفاءة الإنجاز",min:"12 دقيقة",p:"P04",
 intro:"اختر نصًا أو ملاحظات أو أفكارًا لديك فعلًا: بريد، تقرير، تكليف، ملخص، عرض، أو رسالة مهنية.",
 main:"هذه مسودة أولية لمهمة [حدد النوع]: [الصق النص]. الجمهور المستهدف: [حدد الجمهور]. الهدف: [حدد الهدف]. أعد تنظيمها وتحسين وضوحها واختصارها مع الحفاظ على المعنى، ثم اذكر أهم 3 تغييرات أجريتها.",
 guide:["هذه مسودتي: [الصق النص]. حسّن تنظيمها ووضوحها مع الحفاظ على المعنى.","قبل التعديل، اسألني عن الجمهور والهدف من النص حتى تصبح الصياغة أكثر ملاءمة.","أنشئ نسخة مختصرة وأكثر مهنية من المسودة، ثم وضّح أهم التغييرات.","قارن بين المسودة الأصلية والنسخة المحسنة، وحدد 3 أشياء تعلمتها لتحسين كتابتي مستقبلًا."],
 blocks:[{t:"field",pre:1,id:"type",map:["حدد النوع"],label:"نوع المهمة (بريد، تقرير، ملخص…)",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"raw",map:["الصق النص"],label:"المدخل الخام أو وصفه",rows:4,sub:"الصق مسودتك هنا"},{t:"field",pre:1,id:"aud",map:["حدد الجمهور"],label:"الجمهور المستهدف",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"goal",map:["حدد الهدف"],label:"الهدف من النص",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},

{id:"a5",short:"مراجعة",tag:"النشاط 5",title:"مراجعة وتحسين الجودة",axis:"المحور الثالث · رفع كفاءة الإنجاز",min:"8 دقائق",p:"P05",
 intro:"استخدم الذكاء الاصطناعي «مراجعًا» لا «كاتبًا بديلًا». أعطه مخرج النشاط السابق واطلب نقده وفق معايير واضحة.",
 main:"راجع المخرج السابق بوصفك مراجعًا مهنيًا. قيّمه من حيث الوضوح، الدقة، الاختصار، وملاءمة الجمهور. لا تعِد كتابته مباشرة؛ أعطني الملاحظات أولًا، ثم اقترح تعديلات محددة.",
 guide:["راجع هذا المخرج من حيث الوضوح والدقة والاختصار وملاءمة الجمهور: [الصق المخرج].","لا تعد كتابة النص الآن؛ أعطني أولًا أهم 3 ملاحظات تحسين فقط.","رتّب ملاحظاتك من الأكثر أثرًا إلى الأقل أثرًا، وفسّر سبب كل ملاحظة.","بعد المراجعة، اقترح نسخة محسنة تطبق الملاحظات التي وافقت عليها فقط."],
 blocks:[{t:"field",pre:1,id:"out",map:["الصق المخرج"],label:"المخرج الذي سأراجعه",rows:4,sub:"اكتب أو الصق مخرجك هنا",from:"a4.final",fromLabel:"استخدم نسختي النهائية من النشاط 4"},{t:"result",id:"res",label:"ملاحظات المراجع"},
  {t:"table",id:"crit",label:"قراري في كل معيار",cols:["المعيار","ملاحظة المراجع","قراري"],fixed:["الوضوح","الدقة","الاختصار","ملاءمة الجمهور"]}],
 closing:"ليس كل اقتراح من الذكاء الاصطناعي تحسينًا. القرار النهائي لك."},
{id:"a6",short:"مساري",ext:true,tag:"النشاط 6",title:"ابنِ مسار تعلم شخصي",axis:"امتداد · بعد الورشة",min:"اختياري",p:"P06",
 intro:"اختر مهارة واحدة تحتاجها خلال الأشهر القادمة، لا مهارة عامة جدًا.",
 main:"أريد تعلم مهارة [اسم المهارة]. مستواي الحالي: [صفه]. هدفي خلال [مدة زمنية]: [الهدف]. ابنِ لي مسار تعلم على مراحل، ولكل مرحلة: ما الذي أتعلمه، تطبيق عملي، ودليل واضح يثبت أنني أتقنتها.",
 guide:["أريد تعلم مهارة [اكتب المهارة]. مستواي الحالي [صفه]. ابنِ لي مسار تعلم تدريجيًا.","قسّم المسار إلى مراحل، واجعل لكل مرحلة تطبيقًا عمليًا ودليلًا على الإتقان.","عدّل الخطة بحيث تناسب وقتًا أسبوعيًا قدره [عدد] ساعات فقط.","راجع الخطة واحذف أي جزء نظري لا يخدمني مباشرة في الوصول إلى هدفي."],
 blocks:[{t:"field",pre:1,id:"skill",map:["اسم المهارة","اكتب المهارة"],label:"المهارة",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"lvl",map:["صفه"],label:"مستواي الحالي",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"goal",map:["الهدف"],label:"المستوى الذي أريد الوصول إليه",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"dur",map:["مدة زمنية"],label:"المدة الزمنية",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"wk",map:["عدد"],label:"الوقت الأسبوعي المتاح (بالساعات)",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},

{id:"a7",short:"تعلمي",tag:"النشاط 7",title:"حوّل الذكاء الاصطناعي إلى مدرّب شخصي",axis:"المحور الرابع · التعلم وتطوير المهارات",min:"8 دقائق",p:"P07",
 intro:"اجعله يشرح لك مفهومًا صعبًا، ثم يختبر فهمك، ثم يغيّر طريقة الشرح إذا أخطأت.",
 main:"اشرح لي مفهوم [اسم المفهوم] بطريقة مبسطة تناسب مستواي. بعد الشرح لا تعطِني مزيدًا من المعلومات؛ اسألني 3 أسئلة متدرجة. بناءً على إجاباتي، حدد نقطة الضعف وأعد شرحها بطريقة مختلفة.",
 guide:["اشرح لي مفهوم [اكتب المفهوم] بطريقة بسيطة تناسب مستواي.","بعد الشرح، اسألني 3 أسئلة متدرجة ولا تعطِني الإجابات حتى أجيب.","إذا أخطأت، حدّد موضع الخطأ وأعد الشرح بطريقة مختلفة مع مثال.","في النهاية أعطني سؤالًا تطبيقيًا جديدًا يقيس الفهم لا الحفظ."],
 blocks:[{t:"field",pre:1,id:"concept",map:["اسم المفهوم","اكتب المفهوم"],label:"المفهوم الذي سأتعلمه",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},

  {t:"field",id:"after",label:"كيف تغيّر فهمي بعد إعادة الشرح؟",rows:3}]},
{id:"a8",short:"فرصتي",tag:"النشاط 8",title:"حلّل فرصة وظيفية",axis:"المحور الخامس · الاستعداد لسوق العمل",min:"12 دقيقة",p:"P08",
 intro:"اختر إعلانًا وظيفيًا حقيقيًا يهمك. لا نبحث عن وظيفة مثالية؛ نبحث عن فرصة تكشف لك ما يحتاجه السوق.",
 main:"هذا وصف وظيفي: [الصق الوصف]. استخرج المهارات والمتطلبات الأساسية، وصنفها إلى: ضرورية، مفضلة، ويمكن تعلمها سريعًا. ثم أنشئ جدول فجوات أضع فيه ما أمتلكه وما أحتاج تطويره خلال 30 يومًا.",
 guide:["حلّل هذا الوصف الوظيفي واستخرج أهم المهارات والمتطلبات: [الصق الوصف].","صنّف المتطلبات إلى: ضرورية، مفضلة، ويمكن تطويرها بسرعة.","قارن المتطلبات بمهاراتي الحالية التالية: [اكتب مهاراتك] وحدد الفجوات.","ابنِ لي خطة تطوير لمدة 30 يومًا تركز على أهم فجوتين فقط."],
 blocks:[{t:"field",pre:1,id:"job",label:"المسمى الوظيفي",rows:1},{t:"field",pre:1,id:"desc",map:["الصق الوصف"],label:"الوصف الوظيفي",rows:5,sub:"الصقه هنا وينتقل تلقائيًا إلى المطالبة"},{t:"field",pre:1,id:"sk",map:["اكتب مهاراتك"],label:"مهاراتي الحالية",rows:3,sub:"اختيارية: تُستخدم في المطالبة الإرشادية الثالثة"},

{id:"a9",short:"مقابلة",ext:true,tag:"النشاط 9",title:"استعد لمقابلة مهنية",axis:"امتداد · بعد الورشة",min:"اختياري",p:"P09",
 intro:"اجعل الذكاء الاصطناعي يؤدي دور مسؤول التوظيف. أجب بصوتك أو كتابةً، ثم اطلب تغذية راجعة محددة.",
 main:"قم بدور مسؤول توظيف لوظيفة [المسمى]. اسألني سؤالًا واحدًا في كل مرة، وانتظر إجابتي. بعد كل إجابة أعطني ملاحظة واحدة فقط للتحسين، ثم انتقل للسؤال التالي. اجعل الأسئلة مناسبة لخريج أو حديث التخرج.",
 guide:["قم بدور مسؤول توظيف لوظيفة [المسمى] واسألني سؤالًا واحدًا في كل مرة.","بعد كل إجابة أعطني ملاحظة واحدة محددة للتحسين ثم انتقل للسؤال التالي.","إذا كانت إجابتي عامة، اطلب مني مثالًا واقعيًا يدعمها.","بعد 5 أسئلة، لخّص أقوى نقطتين لدي وأهم نقطتين أحتاج تطويرهما."],
 blocks:[{t:"field",pre:1,id:"title",map:["المسمى"],label:"المسمى الوظيفي المستهدف",rows:1,sub:"تنتقل تلقائيًا إلى المطالبة"},{t:"field",id:"q",label:"السؤال الأصعب الذي وُجّه لي",rows:2},
  {t:"field",id:"a",label:"إجابتي المختصرة",rows:3},
  {t:"field",id:"fb",label:"أهم ملاحظة تحسين حصلت عليها",rows:2}]},
{id:"a10",short:"مساعدي",tag:"النشاط 10",title:"صمّم مساعدك الشخصي",axis:"المحور السادس · بناء مساعد شخصي للإنتاجية",min:"10 دقائق",p:"P10",
 intro:"اكتب مواصفات المساعد الذي تحتاجه أنت، لا مساعدًا عامًا للجميع.",
 main:"أريد بناء مساعد شخصي للإنتاجية. دوره الأساسي: [الدور]. أهدافي: [الأهداف]. أكثر المهام التي أحتاج المساعدة فيها: [المهام]. أسلوبي المفضل: [الأسلوب]. الأشياء التي لا أريد منه فعلها: [الحدود]. اكتب لي تعليمات تأسيسية واضحة وقصيرة أستطيع استخدامها مع أي محادثة جديدة.",
 guide:["ساعدني في تصميم مساعد شخصي للإنتاجية يناسب أهدافي وطريقة عملي.","اسألني 4 أسئلة فقط تحدد دوره، أهدافي، المهام التي يساعدني فيها، والحدود التي أريدها.","اكتب لي تعليمات تأسيسية قصيرة وواضحة أستطيع نسخها في بداية أي محادثة.","راجع التعليمات واختصرها دون فقدان أي قاعدة مهمة، وتأكد أنها لا تتضمن بيانات شخصية حساسة."],

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let tmr,saveOk=true;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){saveOk=false}
  const el=$("#saved");el.textContent=saveOk?"تم الحفظ":"الحفظ غير متاح في هذا المتصفح";el.classList.add("on");
  clearTimeout(tmr);tmr=setTimeout(()=>el.classList.remove("on"),1400);markDone();

const get=(k,d="")=>S[k]===undefined?d:S[k];
const set=(k,v)=>{S[k]=v;save()};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1500)}
function grow(t){t.style.height="auto";t.style.height=(t.scrollHeight+4)+"px"}

async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){}
  const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();return ok;
}

/* ============ المطالبة بحقول قابلة للتعبئة ============ */
const FIELDS=[];
function related(key){const s=new Set([key]);FIELDS.forEach(f=>{if(f.keys.includes(key))f.keys.forEach(k=>s.add(k))});return[...s]}
function propagate(key,val,src){
  const rel=related(key);
  rel.forEach(k=>{S[k]=val;
    document.querySelectorAll(".chip").forEach(c=>{if(c.dataset.key===k&&c!==src){c.textContent=val;c.classList.toggle("filled",!!val.trim())}})});
  FIELDS.forEach(f=>{if(f.el!==src&&f.keys.some(k=>rel.includes(k))){f.el.value=val;f.pv.textContent=val;grow(f.el)}});
  save();
}
const chipVal=c=>c.textContent;
function promptCard(actId,text,label){
  const card=document.createElement("div");card.className="card";
  const head=document.createElement("div");head.className="ptag";
  head.innerHTML=`<span>${label}</span>`;
  const btn=document.createElement("button");btn.type="button";btn.className="btn sm";btn.textContent="نسخ";
  head.appendChild(btn);card.appendChild(head);
  const p=document.createElement("p");p.className="ptext";
  let last=0,m;BR.lastIndex=0;
  const pushText=x=>{if(x)p.appendChild(document.createTextNode(x))};
  while((m=BR.exec(text))){
    pushText(text.slice(last,m.index));
    const key=actId+".chip."+m[1];
    const c=document.createElement("span");c.className="chip";c.dataset.ph=m[1];c.dataset.key=key;c.setAttribute("role","textbox");c.setAttribute("aria-label",m[1]);
    try{c.contentEditable="plaintext-only"}catch(e){}
    if(c.contentEditable!=="plaintext-only")c.contentEditable="true";
    c.textContent=get(key,"");if(c.textContent)c.classList.add("filled");
    c.addEventListener("input",()=>{const v=chipVal(c);c.classList.toggle("filled",!!v.trim());propagate(key,v,c)});
    c.addEventListener("paste",e=>{e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text"))});
    c.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey)e.preventDefault()});
    p.appendChild(c);last=m.index+m[0].length;
  }
  pushText(text.slice(last));card.appendChild(p);
  btn.addEventListener("click",async()=>{
    let out="",empty=0;p.childNodes.forEach(n=>{if(n.nodeType===3)out+=n.textContent;else{const v=chipVal(n).trim();if(!v)empty++;out+=v||"["+n.dataset.ph+"]"}});
    const ok=await copyText(out);btn.textContent=ok?"تم النسخ ✓":"تعذّر النسخ";
    toast(!ok?"حدّد النص يدويًا وانسخه":empty?"نُسخت، لكن بقيت "+empty+" خانة فارغة. عبّئها أولًا للحصول على نتيجة أدق":"نُسخت المطالبة. الصقها في أداتك");
    setTimeout(()=>btn.textContent="نسخ",1800);
  });
  return card;
}

/* ============ عرض النتيجة المنسّق (جداول وقوائم) ============ */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"$1")}
function splitRow(l){l=l.trim();if(l.startsWith("|"))l=l.slice(1);if(l.endsWith("|"))l=l.slice(0,-1);return l.split("|").map(x=>x.trim())}
const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)&&l.includes("-");
function renderResult(txt){
  const L=txt.replace(/\r/g,"").split("\n");let h="",i=0,list=null,tbl=0;
  const closeList=()=>{if(list){h+=`</${list}>`;list=null}};
  const mk=(head,rows)=>{const n=head.length;let t='<div class="tw"><table class="t"><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join("")+"</tr></thead><tbody>";
    rows.forEach(r=>{t+="<tr>"+Array.from({length:n},(_,k)=>`<td>${inline((r[k]||"").replace(/<br\s*\/?>/gi," · "))}</td>`).join("")+"</tr>"});return t+"</tbody></table></div>"};
  while(i<L.length){
    const l=L[i];
    if(l.includes("|")&&i+1<L.length&&isSep(L[i+1])){
      closeList();const head=splitRow(l);i+=2;const rows=[];
      while(i<L.length&&L[i].includes("|")&&L[i].trim()){rows.push(splitRow(L[i]));i++}
      h+=mk(head,rows);tbl++;continue}
    if(l.includes("\t")&&i+1<L.length&&L[i+1].includes("\t")){
      closeList();const rows=[];while(i<L.length&&L[i].includes("\t")){rows.push(L[i].split("\t").map(x=>x.trim()));i++}
      h+=mk(rows[0],rows.slice(1));tbl++;continue}
    let m;
    if((m=l.match(/^\s{0,3}#{1,6}\s+(.*)/))){closeList();h+=`<h4>${inline(m[1])}</h4>`}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=="ul"){closeList();h+="<ul>";list="ul"}h+=`<li>${inline(m[1])}</li>`}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){closeList();h+="<ol>";list="ol"}h+=`<li>${inline(m[1])}</li>`}
    else if(!l.trim()){closeList()}
    else{closeList();h+=`<p>${inline(l)}</p>`}
    i++;
  }
  closeList();return{html:h,tables:tbl,rich:tbl>0||/^\s*(#|[-*•]\s|\d+[.)]\s)/m.test(txt)||/\*\*/.test(txt)};
}

function fieldBlock(a,b){
  const keys=b.map?b.map.map(l=>a.id+".chip."+l):[a.id+"."+b.id];const k=keys[0];
  const w=document.createElement("div");
  w.innerHTML=`<label class="fl" for="${k}">${b.label}${b.sub?`<span class="sub">${b.sub}</span>`:""}</label>`;
  const t=document.createElement("textarea");t.id=k;t.rows=b.rows||3;t.value=get(k);
  const pv=document.createElement("div");pv.className="pv";pv.textContent=t.value;
  if(b.map){FIELDS.push({el:t,pv,keys});t.addEventListener("input",()=>{propagate(k,t.value,t);pv.textContent=t.value;grow(t)})}
  else t.addEventListener("input",()=>{set(k,t.value);pv.textContent=t.value;grow(t)});
  w.append(t,pv);
  if(b.from){const bt=document.createElement("button");bt.type="button";bt.className="btn ghost sm noprint";bt.textContent=b.fromLabel||"استخدام نسختي السابقة";bt.style.marginTop="8px";
    bt.addEventListener("click",()=>{const v=get(b.from,"");if(!v.trim()){toast("لم تكتب النسخة النهائية في النشاط 4 بعد");return}t.value=v;t.dispatchEvent(new Event("input"))});w.appendChild(bt)}
  setTimeout(()=>grow(t),0);return w;
}
function resultBlock(a,b){
  const k=a.id+"."+b.id,w=document.createElement("div");
  w.innerHTML=`<label class="fl" for="${k}">${b.label}<span class="sub">${b.sub||"الصق النتيجة هنا إن أردت الاحتفاظ بها"}</span></label>`;
  const t=document.createElement("textarea");t.id=k;t.rows=4;t.value=get(k);t.placeholder="الصق هنا…";
  const view=document.createElement("div");view.className="rview";view.hidden=true;
  const tools=document.createElement("div");tools.className="rtools";
  const edit=document.createElement("button");edit.type="button";edit.className="btn ghost sm";
  const clear=document.createElement("button");clear.type="button";clear.className="btn ghost sm";clear.textContent="مسح";
  tools.append(edit,clear);
  let mode="edit";
  function paint(force){
    const v=t.value.trim();
    if(!v){view.hidden=true;t.hidden=false;tools.hidden=true;return}
    const r=renderResult(v);view.innerHTML=r.html;view.classList.add("hasres");
    if(force)mode=force;
    const show=mode==="view"&&r.rich;
    t.hidden=show;view.hidden=!(r.rich);tools.hidden=false;
    edit.textContent=show?"تعديل النص":"عرض منسّق";edit.hidden=!r.rich;
    if(!r.rich){view.hidden=true}
    if(!show)grow(t);
  }
  t.addEventListener("input",()=>{set(k,t.value);grow(t);const r=renderResult(t.value);view.innerHTML=r.html;view.hidden=!r.rich||mode==="edit";edit.hidden=!r.rich;tools.hidden=!t.value.trim()});
  t.addEventListener("paste",()=>setTimeout(()=>{set(k,t.value);const r=renderResult(t.value);if(r.rich){mode="view";paint("view");toast(r.tables?"تعرّفنا على الجدول ونسّقناه":"نسّقنا النتيجة")}},30));
  edit.addEventListener("click",()=>{mode=mode==="view"?"edit":"view";paint()});
  clear.addEventListener("click",()=>{if(clear.dataset.s!=="1"){clear.dataset.s="1";clear.textContent="تأكيد المسح";setTimeout(()=>{clear.dataset.s="";clear.textContent="مسح"},2500);return}
    t.value="";set(k,"");mode="edit";clear.dataset.s="";clear.textContent="مسح";paint()});
  w.append(t,view,tools);
  if(t.value.trim()){const r=renderResult(t.value);mode=r.rich?"view":"edit"}
  paint();return w;
}
function tableBlock(a,b){
  const k=a.id+"."+b.id,w=document.createElement("div");
  w.innerHTML=`<label class="fl">${b.label}<span class="sub">اكتب مباشرة في الخانات</span></label>`;
  const box=document.createElement("div");box.className="tw";
  let data=get(k,null);if(!data)data={};
  const n=b.fixed?b.fixed.length:Math.max(b.rows||4,data.n||0);
  const tb=document.createElement("table");tb.className="t";
  tb.innerHTML="<thead><tr>"+b.cols.map(c=>`<th>${c}</th>`).join("")+"</tr></thead>";
  const body=document.createElement("tbody");tb.appendChild(body);
  function addRow(r){
    const tr=document.createElement("tr");
    b.cols.forEach((c,ci)=>{
      const td=document.createElement("td");
      if(b.fixed&&ci===0){td.className="fx";td.textContent=b.fixed[r]}
      else{td.contentEditable="true";td.setAttribute("aria-label",c);td.textContent=data[r+"_"+ci]||"";
        td.addEventListener("input",()=>{data[r+"_"+ci]=td.textContent;data.n=body.rows.length;set(k,data)});
        td.addEventListener("paste",e=>{e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text").replace(/\s*\n\s*/g," "))})}
      tr.appendChild(td)});
    body.appendChild(tr);
  }
  for(let r=0;r<n;r++)addRow(r);
  box.appendChild(tb);w.appendChild(box);
  if(b.add){const bt=document.createElement("button");bt.type="button";bt.className="btn ghost sm";bt.textContent="+ إضافة صف";bt.style.marginTop="8px";
    bt.addEventListener("click",()=>{addRow(body.rows.length);data.n=body.rows.length;set(k,data)});const tl=document.createElement("div");tl.className="rtools";tl.appendChild(bt);w.appendChild(tl)}
  return w;
}
function checksBlock(a,b){
  const k=a.id+"."+b.id,w=document.createElement("div");
  w.innerHTML=`<h2>${b.label}</h2>`;
  const g=document.createElement("div");g.className="checks";const st=get(k,[]);

  w.appendChild(g);return w;
}

  const st=get("end.sum",{});
  rows.forEach((r,i)=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${r}</td><td><input type="checkbox" aria-label="${r}: اكتمل"></td><td><input type="checkbox" aria-label="${r}: أحتاج تحسينه"></td>`;
    [0,1].forEach(c=>{const cb=tr.querySelectorAll("input")[c];cb.checked=!!st[i+"_"+c];cb.addEventListener("change",()=>{const o=get("end.sum",{});o[i+"_"+c]=cb.checked;set("end.sum",o)})});tb.appendChild(tr)});
  w.appendChild(tb);s.appendChild(w);
  const h=document.createElement("h2");h.textContent="التزامي بعد الورشة";s.appendChild(h);
  s.appendChild(fieldBlock({id:"end"},{id:"h24",label:"خلال 24 ساعة سأستخدم الذكاء الاصطناعي في هذه المهمة",rows:2}));
  s.appendChild(fieldBlock({id:"end"},{id:"d7",label:"وخلال 7 أيام سأقيس أثره بهذه الطريقة",rows:2}));
  const q=document.createElement("div");q.className="quote";q.textContent="القيمة ليست في عدد الأدوات التي تعرفها، بل في قدرتك على تحويلها إلى طريقة عمل أفضل.";s.appendChild(q);
  const b=document.createElement("div");b.className="nav noprint";b.style.justifyContent="center";
  b.innerHTML='<button class="btn" type="button" id="pdf2">حفظ دفتري PDF</button>';s.appendChild(b);
  return s;
}
const order=[{id:"home",label:"ابدأ",build:homePage}];
ACTS.forEach(a=>order.push({id:a.id,label:a.short,num:a.tag.replace("النشاط ",""),ext:a.ext,build:()=>actPage(a)}));
order.push({id:"end",label:"الختام",build:endPage});
const main=$("#main");
order.forEach((o,i)=>{
  const s=o.build();main.appendChild(s);o.el=s;s.id="p-"+o.id;const pl=document.createElement("img");pl.className="print-logo";pl.alt="";pl.src=$(".logo-l").src;s.insertBefore(pl,s.firstChild);
  const b=document.createElement("button");b.type="button";b.dataset.id=o.id;if(o.ext)b.className="ext";
  b.innerHTML=(o.num?`<b>${o.num}</b>`:"")+o.label;b.addEventListener("click",()=>go(o.id));steps.appendChild(b);o.btn=b;
  const nv=document.createElement("div");nv.className="nav noprint";
  const prev=order[i-1],next=order[i+1];
  nv.innerHTML=(prev?`<button class="btn ghost" type="button" data-go="${prev.id}">‹ السابق</button>`:"<span></span>")+(next?`<button class="btn" type="button" data-go="${next.id}">التالي ›</button>`:"<span></span>");
  s.appendChild(nv);
});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(g.dataset.go)});
function go(id,noPush){
  const o=order.find(x=>x.id===id)||order[0];
  order.forEach(x=>{x.el.classList.toggle("on",x===o);x.btn.classList.toggle("on",x===o)});
  if(!noPush){try{history.replaceState(null,"","#"+o.id)}catch(e){location.hash=o.id}}
  o.btn.scrollIntoView({inline:"center",block:"nearest"});window.scrollTo(0,0);
  o.el.querySelectorAll("textarea").forEach(grow);
}
function markDone(){
  order.forEach(o=>{if(o.id==="home"||o.id==="end")return;
    const has=Object.keys(S).some(k=>k.startsWith(o.id+".")&&k.indexOf(".chip.")<0&&(Array.isArray(S[k])?S[k].some(Boolean):typeof S[k]==="object"?Object.keys(S[k]).some(x=>x!=="n"&&S[k][x]):String(S[k]).trim()));
    o.btn.classList.toggle("done",has)})}
function pdf(){const n=get("home.name","").trim();const t=document.title;document.title="دفتر المتدرب"+(n?" - "+n:"");
  const done=()=>{document.title=t;window.removeEventListener("afterprint",done)};window.addEventListener("afterprint",done);
  document.querySelectorAll("textarea").forEach(grow);
  try{window.print()}catch(e){toast("افتح الصفحة في المتصفح ثم اضغط Ctrl+P")}}
$("#pdfBtn").addEventListener("click",pdf);
document.addEventListener("click",e=>{if(e.target.id==="pdf2")pdf()});
window.addEventListener("hashchange",()=>go(location.hash.slice(1),true));
go(location.hash.slice(1)||"home",true);markDone();
</script>
</body>
</html>
